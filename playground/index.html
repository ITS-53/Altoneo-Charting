<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altonéo Playground</title>
    <meta name="description" content="Atelier des composants Altonéo Charting : stories, contrôles, code et documentation d'API." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" />
    <script>
      // Thème appliqué avant le premier rendu (pas de flash clair → sombre).
      try {
        var p = JSON.parse(localStorage.getItem("alt-playground") || "{}");
        var t = p.globals && p.globals.theme;
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/shell.js"></script>
  </body>
</html>
