# Intégration continue : installation, lint, typecheck, tests et builds
# (bibliothèque + Storybook) à chaque push et à chaque pull request.
# Le job « ci » est le contrôle requis par la protection de la branche main.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build bibliothèque
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook -- --quiet
