version: 2
updates:
  # Dépendances npm (devDeps : Vite, Storybook, ESLint…) + dépendances transitives
  # vulnérables (esbuild, uuid) — Dependabot ouvrira des PR quand des versions
  # corrigées compatibles seront disponibles.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Le preset (tailwind-preset.cjs) et la peerDependency visent Tailwind v3 :
      # la v4 change le modèle de configuration, migration à mener à part.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns:
          - "*"

  # Actions GitHub utilisées par la CI (le cas échéant)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
